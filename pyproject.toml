[project]
name = "todo-app-flet"
version = "0.3.2"
description = "TodoApp Flet desktop edition"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flet>=1.1.2,<1.2",
    "flet-cli>=1.1.2,<1.2",
    "platformdirs>=4.0,<6",
]

[tool.flet]
product = "TodoApp Flet"
org = "com.sdcom"
bundle_id = "com.sdcom.todoapp.flet"
build_number = 2

[tool.flet.app]
path = "."
module = "main"
exclude = ["test_storage.py", "test_settings_ui.py", "test_window_chrome.py", "__pycache__"]
