name: Flet Edition Build

# 独立 Flet 构建仅生成 Actions 工件，不创建 Git Tag 或 Release。
# 仅手动触发；普通代码提交不会自动占用构建资源。
on:
  workflow_dispatch:

permissions:
  contents: read

# 手动启动的新任务可取消同分支尚未完成的旧任务，以减少浪费。
concurrency:
  group: flet-edition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Flet / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: windows
            arch: ""
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: ""
          # Build x86_64 on an Apple Silicon host. Flet's --arch controls
          # target CPU; Xcode/Flutter can compile x86_64 on macOS ARM64.
          # Verify Mach-O slices after building to avoid shipping ARM-only apps.
          - label: macOS Intel x86_64
            runner: macos-26
            platform: macos
            arch: "--arch x86_64"
          - label: macOS Apple Silicon arm64
            runner: macos-26
            platform: macos
            arch: "--arch arm64"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt


      - name: Install only required Linux desktop build packages
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev zenity

      - name: Install Flet and project dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet-cli>=1.1.2,<1.2" -r requirements.txt

      - name: Python syntax and storage smoke tests
        shell: bash
        run: |
          python -m compileall -q main.py models.py storage.py settings_ui.py appearance.py window_chrome.py
          python -m unittest discover -s . -p "test_*.py" -v

      - name: Cache Dart Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flet-pub-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
          restore-keys: |
            flet-pub-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Build native Flet application
        id: flet
        uses: flet-dev/flet-build-action@v1
        with:
          target: ${{ matrix.platform }}
          working-directory: .
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          cache: true
          # The Ubuntu runner already installed the minimal, known-good set.
          # Flet's automatic install pulled in large multimedia libraries.
          install-linux-dependencies: false
          archive-output: false
          extra-args: ${{ matrix.arch }}

      - name: Verify Intel macOS binary architecture
        if: matrix.platform == 'macos' && matrix.arch == '--arch x86_64'
        shell: bash
        env:
          FLET_OUTPUT_PATH: ${{ steps.flet.outputs.output-path }}
        run: |
          set -euo pipefail
          app="$(find "$FLET_OUTPUT_PATH" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$app"
          binary="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")"
          echo "Target binary: $app/Contents/MacOS/$binary"
          lipo -archs "$app/Contents/MacOS/$binary" | grep -qw x86_64

      - name: Upload Flet build output
        uses: actions/upload-artifact@v4
        with:
          name: todo-flet-${{ matrix.platform }}-${{ matrix.label }}
          path: ${{ steps.flet.outputs.output-path }}
          if-no-files-found: error
          retention-days: 7
