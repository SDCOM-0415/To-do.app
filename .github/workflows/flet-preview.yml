name: Flet Preview Build

# Separate from the legacy release workflow: no tags or Releases are created.
on:
  push:
    branches:
      - feature/flet-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Flet preview / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: windows
            arch: ""
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: ""
          - label: macOS Intel x86_64
            runner: macos-26-intel
            platform: macos
            arch: "--arch x86_64"
          - label: macOS Apple Silicon arm64
            runner: macos-26
            platform: macos
            arch: "--arch arm64"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: flet_port/requirements.txt


      - name: Install Flet and project dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet-cli>=1.1.2,<1.2" -r flet_port/requirements.txt

      - name: Python syntax and storage smoke tests
        shell: bash
        run: |
          python -m compileall -q flet_port
          python -m unittest discover -s flet_port -p "test_*.py" -v

      - name: Cache Dart Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flet-pub-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flet_port/pyproject.toml', 'flet_port/requirements.txt') }}
          restore-keys: |
            flet-pub-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Build native Flet application
        id: flet
        uses: flet-dev/flet-build-action@v1
        with:
          target: ${{ matrix.platform }}
          working-directory: flet_port
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          cache: true
          install-linux-dependencies: true
          archive-output: false
          extra-args: ${{ matrix.arch }}

      - name: Upload preview output
        uses: actions/upload-artifact@v4
        with:
          name: todo-flet-preview-${{ matrix.platform }}-${{ matrix.label }}
          path: ${{ steps.flet.outputs.output-path }}
          if-no-files-found: error
          retention-days: 7
