name: Build and Release (Tk + Flet)

# Unified release is deliberately manual. Normal pushes to either product
# branch never publish a Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Base version (vX.X.X); pre-releases auto-append date and sequence"
        required: true
        type: string
      publish:
        description: "Publish GitHub Release after all eight builds pass (otherwise build only)"
        type: boolean
        default: false
      prerelease:
        description: "Append yyyy-mm-dd-N to the base version and mark as pre-release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: todo-dual-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tk_sha: ${{ steps.refs.outputs.tk_sha }}
      flet_sha: ${{ steps.refs.outputs.flet_sha }}
      version: ${{ steps.refs.outputs.version }}
    steps:
      - name: Resolve release tag and freeze both branch heads
        id: refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_INPUT: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          base_version="$VERSION_INPUT"
          if [[ ! "$base_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Base version must be in vX.X.X format, for example v0.4.0"
            exit 1
          fi

          version="$base_version"
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            # The day is evaluated in China Standard Time (UTC+08:00).
            # Count only exact version/date/positive-integer tags.
            release_day="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
            prefix="${base_version}-${release_day}-"
            highest=0
            # GitHub returns a 404 if no ref begins with this prefix.
            # We query existing matching tags to avoid counting older versions.
            matches="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$prefix" --jq '.[].ref' 2>/dev/null || true)"
            while IFS= read -r ref; do
              [[ -n "$ref" ]] || continue
              tag="${ref#refs/tags/}"
              if [[ "$tag" == "$prefix"* ]]; then
                suffix="${tag#"$prefix"}"
                if [[ "$suffix" =~ ^[1-9][0-9]*$ ]]; then
                  number=$((10#$suffix))
                  if (( number > highest )); then highest="$number"; fi
                fi
              fi
            done <<< "$matches"
            version="${prefix}$((highest + 1))"
            echo "Pre-release tag: $version"
          else
            echo "Stable release tag: $version"
          fi
          # Never overwrite an existing tag even if this is a build-only run.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" >/dev/null 2>&1; then
            echo "::error::Tag $version already exists. Use a new version."
            exit 1
          fi
          tk_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          flet_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/flet-version" --jq '.object.sha')"
          echo "tk_sha=$tk_sha" >> "$GITHUB_OUTPUT"
          echo "flet_sha=$flet_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: ${{ matrix.edition }} / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { edition: Tk, target: Windows-x64, runner: windows-latest, os: windows, arch: x64, flet_platform: '', flet_extra_args: '' }
          - { edition: Tk, target: Linux-x64, runner: ubuntu-24.04, os: linux, arch: x64, flet_platform: '', flet_extra_args: '' }
          - { edition: Tk, target: macOS-x64, runner: macos-26-intel, os: macos, arch: x64, flet_platform: '', flet_extra_args: '' }
          - { edition: Tk, target: macOS-arm64, runner: macos-26, os: macos, arch: arm64, flet_platform: '', flet_extra_args: '' }
          - { edition: Flet, target: Windows-x64, runner: windows-latest, os: windows, arch: x64, flet_platform: windows, flet_extra_args: '' }
          - { edition: Flet, target: Linux-x64, runner: ubuntu-24.04, os: linux, arch: x64, flet_platform: linux, flet_extra_args: '' }
          - { edition: Flet, target: macOS-x64, runner: macos-26-intel, os: macos, arch: x64, flet_platform: macos, flet_extra_args: '--arch x86_64' }
          - { edition: Flet, target: macOS-arm64, runner: macos-26, os: macos, arch: arm64, flet_platform: macos, flet_extra_args: '--arch arm64' }

    steps:
      - name: Checkout the edition's frozen source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.edition == 'Flet' && needs.prepare.outputs.flet_sha || needs.prepare.outputs.tk_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.edition == 'Flet' && 'flet_port/requirements.txt' || 'requirements.txt' }}

      - name: Install Tk Linux system packages
        if: matrix.os == 'linux' && matrix.edition == 'Tk'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev

      - name: Install Tk dependencies
        if: matrix.edition == 'Tk'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install Flet dependencies
        if: matrix.edition == 'Flet'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet-cli>=1.1.2,<1.2" -r flet_port/requirements.txt

      - name: Test Flet task storage
        if: matrix.edition == 'Flet'
        shell: bash
        run: |
          python -m compileall -q flet_port
          python -m unittest discover -s flet_port -p "test_*.py" -v

      - name: Build Tk Windows
        if: matrix.edition == 'Tk' && matrix.os == 'windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean build.spec
          if (!(Test-Path "dist/TodoApp/TodoApp.exe")) { throw "Tk Windows executable missing" }

      - name: Build Tk Linux
        if: matrix.edition == 'Tk' && matrix.os == 'linux'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name TodoApp \
            --collect-all customtkinter app.py
          test -f dist/TodoApp

      - name: Build Tk macOS
        if: matrix.edition == 'Tk' && matrix.os == 'macos'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name TodoApp \
            --collect-all customtkinter app.py
          test -d dist/TodoApp.app

      - name: Cache Dart Pub packages
        if: matrix.edition == 'Flet'
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flet-pub-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flet_port/pyproject.toml', 'flet_port/requirements.txt') }}
          restore-keys: |
            flet-pub-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Flet
        if: matrix.edition == 'Flet'
        id: flet
        uses: flet-dev/flet-build-action@v1
        with:
          target: ${{ matrix.flet_platform }}
          working-directory: flet_port
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          cache: true
          install-linux-dependencies: true
          archive-output: false
          extra-args: ${{ matrix.flet_extra_args }}

      - name: Set artifact name
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          EDITION: ${{ matrix.edition }}
          TARGET: ${{ matrix.target }}
          FLET_OUTPUT_PATH: ${{ steps.flet.outputs.output-path }}
        run: |
          echo "ARTIFACT_NAME=Todo-App-${RELEASE_VERSION}-${EDITION}-${TARGET}" >> "$GITHUB_ENV"
          if [[ -n "${FLET_OUTPUT_PATH:-}" ]]; then
            echo "FLET_BUILD_PATH=$FLET_OUTPUT_PATH" >> "$GITHUB_ENV"
          fi

      - name: Package Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-files | Out-Null
          if ("${{ matrix.edition }}" -eq "Tk") {
            Compress-Archive -Path "dist/TodoApp" -DestinationPath "release-files/$env:ARTIFACT_NAME.zip" -Force
          } else {
            Compress-Archive -Path "$env:FLET_BUILD_PATH/*" -DestinationPath "release-files/$env:ARTIFACT_NAME.zip" -Force
          }

      - name: Package Linux
        if: matrix.os == 'linux'
        shell: bash
        run: |
          mkdir -p release-files
          if [[ "${{ matrix.edition }}" == "Tk" ]]; then
            tar -czf "release-files/$ARTIFACT_NAME.tar.gz" -C dist TodoApp
          else
            tar -czf "release-files/$ARTIFACT_NAME.tar.gz" -C "$FLET_BUILD_PATH" .
          fi

      - name: Package macOS
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          if [[ "${{ matrix.edition }}" == "Tk" ]]; then
            app="dist/TodoApp.app"
          else
            app="$(find "$FLET_BUILD_PATH" -maxdepth 2 -type d -name '*.app' -print -quit)"
          fi
          test -n "$app" && test -d "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "release-files/$ARTIFACT_NAME.zip"

      - name: Upload edition artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-${{ matrix.target }}
          path: release-files/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish one combined GitHub Release
    if: ${{ inputs.publish }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both editions
        uses: actions/download-artifact@v4
        with:
          pattern: "*-*"
          path: release-files
          merge-multiple: true

      - name: Verify exactly eight release files
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for edition in Tk Flet; do
            for target in Windows-x64 Linux-x64 macOS-x64 macOS-arm64; do
              case "$target" in
                Windows-*|macOS-*) ext=zip ;;
                *) ext=tar.gz ;;
              esac
              test -s "release-files/Todo-App-$RELEASE_VERSION-$edition-$target.$ext" || {
                echo "::error::Missing $edition $target"
                exit 1
              }
            done
          done
          count="$(find release-files -type f | wc -l)"
          test "$count" -eq 8
          (cd release-files && sha256sum * > SHA256SUMS.txt)

      - name: Prepare release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TK_SHA: ${{ needs.prepare.outputs.tk_sha }}
          FLET_SHA: ${{ needs.prepare.outputs.flet_sha }}
        run: |
          cat > release-notes.md <<EOF
          ## Todo App $RELEASE_VERSION

          This release contains **two independently maintained desktop editions**:
          - **Tk**: CustomTkinter, source from `main` at `$TK_SHA`.
          - **Flet**: Flutter/Flet, source from `flet-version` at `$FLET_SHA`.

          Each edition has Windows x64, Linux x64, macOS Intel x64 and macOS Apple Silicon arm64 downloads.
          Pick the file matching your desired edition and operating system.
          The Tk and Flet versions use separate storage locations; back up or export your tasks before switching editions.

          The macOS artifacts are ZIP archives containing the application bundle.
          Check `SHA256SUMS.txt` for file integrity.
          EOF

      - name: Create release only after every build succeeded
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TK_SHA: ${{ needs.prepare.outputs.tk_sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_VERSION" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TK_SHA" \
            --title "Todo App $RELEASE_VERSION (Tk + Flet)" \
            --notes-file release-notes.md \
            "${args[@]}"
