[project]
name = "todo-app-flet-preview"
version = "0.3.1"
description = "Experimental cross-platform Flet UI for Todo App"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flet>=1.1.2,<1.2",
    "platformdirs>=4.0,<6",
]

[tool.flet]
product = "Todo App"
org = "com.sdcom"
bundle_id = "com.sdcom.todoapp"
build_number = 1

[tool.flet.app]
path = "."
module = "main"
exclude = ["test_storage.py", "__pycache__"]
